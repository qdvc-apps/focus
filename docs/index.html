    '<div class="now-empty">' +
      '<div class="now-empty-title">Nothing running' +
        (r.idleSince ? '<span class="timer"> for ' + T('dur', r.idleSince, 0, now) + '</span>' : '') + '</div>' +
      '<p class="now-empty-text">' + (next
        ? 'Up next is <b>' + U.esc(next.title) + '</b>.'
        : 'What are you working on?') + '</p>' +
      (next ? '<button type="button" class="btn btn-go" data-act="start" data-id="' + U.esc(next.id) + '">' + I('play') +
        '<span>Start up next</span></button>' : '') +
      '<form class="add-form" data-form="quick-start" autocomplete="off">' +
        '<input class="field" id="quick-start-input" name="title" maxlength="300" placeholder="' +
          (next ? 'Or type something else and press Enter to start it' : 'Type a task and press Enter to start it') +
          '" aria-label="Start a new task">' +
        '<button type="submit" class="btn">' + I('play') + '<span>Start</span></button>' +
      '</form>' +
      '<div class="drop-hint" aria-hidden="true">Drop to start it</div>' +
    '</div>';
};
/* ---------- src/js/64-overview.js ---------- */
/* ==========================================================================
   64-overview.js — the left drawer: today at a glance, what is going on
   right now, and a list of days to jump to on the timeline.

   With tasks running in parallel, "time running" means time with at least
   one task running (the union of stretches), not the sum of them.
   ========================================================================== */

QDF.view.overview = function (s, now) {
  var U = QDF.util, M = QDF.model, T = QDF.view.tick;
  var t0 = U.dayStart(now);
  var all = s.done.concat(s.active, s.queue);

  /* Merge intervals into their union; returns total seconds. */
  function unionSeconds(spans) {
    var sorted = spans.slice().sort(function (a, b) { return a[0] - b[0]; });
    var total = 0, cur = null;
    sorted.forEach(function (sp) {
      if (!cur || sp[0] > cur[1]) { if (cur) total += cur[1] - cur[0]; cur = [sp[0], sp[1]]; }
      else cur[1] = Math.max(cur[1], sp[1]);
    });
    if (cur) total += cur[1] - cur[0];
    return Math.floor(total / 1000);
  }

  /* ----------------------------------------------------------- today */
  var spans = [], longest = 0;
  all.forEach(function (item) {
    item.stretches.forEach(function (st) {
      var a = U.ms(st.from), b = st.to ? U.ms(st.to) : now;
      if (b <= t0) return;
      a = Math.max(a, t0);
      spans.push([a, b, !st.to]);
      longest = Math.max(longest, (b - a) / 1000);
    });
  });
  var running = unionSeconds(spans);
  var doneToday = s.done.filter(function (d) { return U.ms(d.finished) >= t0; }).length;

  /* Most at once: sweep the starts and ends. */
  var edges = [];
  spans.forEach(function (sp) { edges.push([sp[0], 1], [sp[1], -1]); });
  edges.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  var most = 0, level = 0;
  edges.forEach(function (e) { level += e[1]; most = Math.max(most, level); });

  function tile(value, label, cls) {
    return '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="tile-value">' + value + '</div><div class="tile-label">' + label + '</div></div>';
  }

  var tiles =
    tile(s.active.length ? T('dur', U.iso(now), running, now) : U.esc(U.duration(running)), 'Running today', s.active.length ? 'timer' : '') +
    tile(String(doneToday), doneToday === 1 ? 'Task done' : 'Tasks done') +
    tile(U.esc(U.duration(longest)), 'Longest stretch') +
    tile(String(most), 'Most at once');

  /* The day at a glance: one track per lane, filled greedily. */
  var ribbon = '';
  if (spans.length) {
    var first = Math.min.apply(null, spans.map(function (sp) { return sp[0]; }));
    var start = Math.floor(first / 3600000) * 3600000;
    var end = Math.max(start + 3600000, Math.ceil(now / 3600000) * 3600000);
    var range = end - start;
    var pct = function (v) { return ((v - start) / range * 100).toFixed(3) + '%'; };
    var tracks = [];
    spans.slice().sort(function (a, b) { return a[0] - b[0]; }).forEach(function (sp) {
      var k = 0;
      while (tracks[k] && tracks[k] > sp[0]) k++;
      tracks[k] = sp[1];
      sp.track = k;
    });
    var n = Math.min(tracks.length, 4), h = Math.floor(22 / n);
    var ticks = '';
    for (var hh = start + 3600000; hh < end; hh += 3600000) ticks += '<span class="rb-tick" style="left:' + pct(hh) + '"></span>';
    ribbon =
      '<div class="ribbon" role="img" aria-label="Today: when tasks were running, one track for each task running at once">' + ticks +
        spans.filter(function (sp) { return sp.track < 4; }).map(function (sp) {
          return '<span class="rb-seg lc' + (sp.track % 5) + '" style="left:' + pct(sp[0]) + ';width:' +
            ((sp[1] - sp[0]) / range * 100).toFixed(3) + '%;top:' + (4 + sp.track * (h + 1)) + 'px;height:' + (h - 1) + 'px"></span>';
        }).join('') +
      '</div>' +
      '<div class="rb-scale"><span>' + U.esc(U.timeOfDay(U.iso(start))) + '</span><span>' + U.esc(U.timeOfDay(U.iso(end))) + '</span></div>';
  }

  /* ------------------------------------------------------- right now */
  var fg = M.foreground(s), next = M.upNext(s);
  function row(key, value) {
    return '<div class="ov-row"><span class="ov-key">' + key + '</span><span class="ov-val">' + value + '</span></div>';
  }
  var others = s.active.length - (fg ? 1 : 0);
  var rightNow =
    row('Foreground', fg ? U.esc(fg.title) : '<span class="dim">Nothing running</span>') +
    row('Alongside', others ? U.esc(U.plural(others, 'other task')) : '<span class="dim">Nothing else</span>') +
    row('Up next', next ? U.esc(next.title) : '<span class="dim">Nothing queued</span>') +
    row('Queued', U.esc(U.plural(s.queue.length, 'task')));

  /* ------------------------------------------------------------ days */
  var days = {};
  function day(key) { return days[key] || (days[key] = { spans: [], done: 0 }); }
  all.forEach(function (item) {
    item.stretches.forEach(function (st) {
      day(U.dayKey(st.from)).spans.push([U.ms(st.from), st.to ? U.ms(st.to) : now]);
    });
  });
  s.done.forEach(function (item) { day(U.dayKey(item.finished)).done++; });
  var list = Object.keys(days).sort().reverse().slice(0, 60).map(function (k) {
    var d = days[k];
    return '<li><button type="button" class="day-link" data-act="jump-day" data-day="' + U.esc(k) + '">' +
      '<span class="day-name">' + U.esc(U.dayLabel(new Date(k + 'T12:00:00').toISOString(), now)) + '</span>' +
      '<span class="day-sub">' + (d.done ? d.done + ' done · ' : '') + U.esc(U.duration(unionSeconds(d.spans))) + '</span>' +
    '</button></li>';
  }).join('');

  return '<div class="dw">' +
    '<div class="dw-head"><span class="label">Overview</span></div>' +
    '<section class="dw-section"><div class="label">Today</div><div class="tiles">' + tiles + '</div>' +
      (ribbon || '<p class="dim">Nothing yet today.</p>') + '</section>' +
    '<section class="dw-section"><div class="label">Right now</div>' + rightNow + '</section>' +
    '<section class="dw-section"><div class="label">Jump to</div><ul class="day-list">' +
      '<li><button type="button" class="day-link" data-act="jump-now"><span class="day-name">Now</span><span class="day-sub">' +
        T('tod', null, 0, now) + '</span></button></li>' + list +
    '</ul></section>' +
  '</div>';
};
/* ---------- src/js/66-inspector.js ---------- */
/* ==========================================================================
   66-inspector.js — the right drawer: everything about the selected task.
   Its title and notes are edited in place and saved when the field loses
   focus (or on Enter in the title, Ctrl+Enter in the notes).
   ========================================================================== */

QDF.view.inspector = function (s, now, id) {
  var U = QDF.util, M = QDF.model, I = QDF.icon, T = QDF.view.tick;
  var head = '<div class="dw-head"><span class="label">Inspector</span>';
  var loc = id ? M.find(s, id) : null;

  if (!loc) {
    return '<div class="dw">' + head + '</div>' +
      '<div class="dw-empty">Click a task on the timeline to see its details, its history and what you can do with it.</div></div>';
  }

  var item = loc.item, eid = U.esc(item.id);
  var open = M.openStretch(item);
  var isFg = loc.list === 'active' && M.foreground(s) === item;
  var status = {
    active: isFg ? 'In the foreground' : 'Running alongside',
    queue: loc.index === 0 ? 'Up next' : 'Queued, ' + ordinal(loc.index + 1),
    done: 'Done'
  }[loc.list];

  function ordinal(n) {
    var sfx = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th');
    return n + sfx;
  }

  function when(iso) {
    var day = U.dayKey(iso) === U.dayKey(U.iso(now)) ? '' : U.dayLabel(iso, now) + ', ';
    return U.esc(day + U.timeOfDay(iso));
  }

  /* -------------------------------------------------------------- facts */
  var banked = M.total(item, now) - M.live(item, now);
  var first = M.started(item);
  var facts = '<dt>Added</dt><dd>' + when(item.created) + '</dd>';
  if (first) {
    facts += '<dt>First started</dt><dd>' + when(first) + '</dd>';
    facts += item.finished
      ? '<dt>Finished</dt><dd>' + when(item.finished) + '</dd><dt>Start to finish</dt><dd>' + U.esc(U.duration(M.span(item))) + '</dd>'
      : '<dt class="timer">Since first start</dt><dd class="timer">' + T('dur', first, 0, now) + '</dd>';
    facts += open
      ? '<dt class="timer">Running in all</dt><dd class="timer">' + T('dur', open.from, banked, now) + '</dd>'
      : '<dt>Running in all</dt><dd>' + U.esc(U.duration(banked)) + '</dd>';
    facts += '<dt>Stretches</dt><dd>' + item.stretches.length + '</dd>';
  } else {
    facts += '<dt>Started</dt><dd class="dim">Not yet</dd>';
  }

  /* ------------------------------------------------------------ history */
  var stretches = item.stretches.map(function (st) {
    return '<li>' +
      '<span class="sw lc0" aria-hidden="true"></span>' +
      '<span class="stretch-when">' + when(st.from) + '–' + (st.to ? U.esc(U.timeOfDay(st.to)) : 'now') + '</span>' +
      '<span class="stretch-len">' + (st.to ? U.esc(U.duration(M.duration(st, now))) : '<span class="timer">' + T('durp', st.from, 0, now) + '</span>') + '</span>' +
    '</li>';
  }).join('');

  /* ------------------------------------------------------------ actions */
  function act(name, icon, label, cls) {
    return '<button type="button" class="btn btn-sm btn-block' + (cls ? ' ' + cls : '') + '" data-act="' + name + '" data-id="' + eid + '">' +
      I(icon) + '<span>' + label + '</span></button>';
  }
  var next = M.upNext(s);
  var actions = {
    active:
      (isFg ? '' : act('foreground', 'target', 'Bring to the foreground', 'btn-primary')) +
      (isFg && next ? act('done-next', 'check', 'Done, start next', 'btn-go') : '') +
      act('finish', 'check', 'Done', isFg && next ? '' : 'btn-go') +
      (isFg && next ? act('start-next', 'parallel', 'Start up next alongside') : '') +
      act('pause-front', 'pause', 'Pause, keep it up next') +
      act('pause-end', 'queueEnd', 'Pause, back to the end of the queue'),
    queue:
      act('start', 'play', 'Start now, alongside anything running', 'btn-go') +
      (loc.index ? act('make-next', 'up', 'Do this next') : ''),
    done:
      act('restore', 'restore', 'Back to the queue')
  }[loc.list] + act('remove', 'trash', loc.list === 'done' ? 'Remove from history' : 'Remove task');

  return '<div class="dw">' + head + '<span class="chip' + (loc.list === 'done' ? ' chip-done' : '') + '">' + U.esc(status) + '</span></div>' +
    '<div class="ins-body">' +
      '<input class="field ins-title" id="ins-title" data-edit="title" data-id="' + eid + '" maxlength="300" value="' + U.esc(item.title) + '" aria-label="Title">' +
      '<textarea class="field field-area" id="ins-notes" data-edit="notes" data-id="' + eid + '" rows="5" placeholder="Notes: links, commands, where you left off…" aria-label="Notes">' +
        U.esc(item.notes || '') + '</textarea>' +
      '<div class="ins-hint">Saved when you click away. <kbd>Ctrl</kbd>+<kbd>Enter</kbd> saves notes.</div>' +
    '</div>' +
    '<section class="dw-section"><div class="label">Times</div><dl class="facts">' + facts + '</dl></section>' +
    (stretches ? '<section class="dw-section"><div class="label">History</div><ol class="stretch-list">' + stretches + '</ol></section>' : '') +
    '<section class="dw-section"><div class="label">Actions</div><div class="ins-actions">' + actions + '</div></section>' +
  '</div>';
};
/* ---------- src/js/68-transfer.js ---------- */
/* ==========================================================================
   68-transfer.js — the YAML view, export and import.
   ========================================================================== */

QDF.transfer = (function () {
  var U = QDF.util;

  /* Light syntax colouring for the emitted subset. Works line by line on
     escaped text, so it can never inject markup. */
  function highlight(text) {
    return text.replace(/\n$/, '').split('\n').map(function (line) {
      var m;
      if (/^\s*#/.test(line)) return '<span class="y-comment">' + U.esc(line) + '</span>';
      if ((m = /^(\s*)(- )?([^\s:"'][^:]*|"[^"]*"):( (.*))?$/.exec(line))) {
        return U.esc(m[1]) + (m[2] ? '<span class="y-dash">- </span>' : '') +
          '<span class="y-key">' + U.esc(m[3]) + '</span><span class="y-punct">:</span>' +
          (m[4] ? ' ' + value(m[5]) : '');
      }
      if ((m = /^(\s*)- (.*)$/.exec(line))) {
        return U.esc(m[1]) + '<span class="y-dash">- </span>' + value(m[2]);
      }
      return '<span class="y-text">' + U.esc(line) + '</span>';
    }).join('\n');
  }

  function value(v) {
    var cls = 'y-str';
    if (/^(null|~|true|false|\[\]|\{\})$/.test(v)) cls = 'y-lit';
    else if (/^-?\d+(\.\d+)?$/.test(v)) cls = 'y-num';
    else if (/^\d{4}-\d\d-\d\dT/.test(v)) cls = 'y-time';
    else if (/^[|>][-+]?$/.test(v)) cls = 'y-punct';
    return '<span class="' + cls + '">' + U.esc(v) + '</span>';
  }

  function currentYaml() {
    return QDF.serialize.toYaml(QDF.store.get(), QDF.store.now());
  }

  function fileName() {
    return 'qdvc-focus-' + U.fileStamp(QDF.store.now()) + '.yaml';
  }

  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else {
      fallback();
    }
  }

  function showYaml() {
    var text = currentYaml();
    var lines = text.replace(/\n$/, '').split('\n').length;
    QDF.ui.dialog({
      title: 'Current state as YAML',
      wide: true,
      className: 'dialog-code',
      body:
        '<div class="code-meta">' +
          '<span>' + U.plural(lines, 'line') + ' · ' + U.plural(text.length, 'character') + '</span>' +
          '<span class="dim">Read-only. Export it to keep it; import it to pick up where you left off.</span>' +
        '</div>' +
        '<pre class="code" tabindex="0" aria-label="State as YAML">' + highlight(text) + '</pre>',
      buttons: [
        { label: 'Copy', icon: 'copy', align: 'left', onClick: function () {
            copyText(text, function (ok) {
              QDF.ui.toast(ok ? 'Copied the YAML to the clipboard.' : 'Could not copy; select the text and copy it yourself.',
                ok ? null : { tone: 'error' });
            });
            return false;
          } },
        { label: 'Download .yaml', icon: 'exportFile', onClick: function () { exportYaml(text); return false; } },
        { label: 'Close', primary: true }
      ]
    });
  }

  function exportYaml(text) {
    var name = fileName();
    U.download(name, text || currentYaml(), 'application/yaml');
    QDF.ui.toast('Exported ' + name + '.');
  }

  function summary(st) {
    var bits = [];
    var fg = QDF.model.foreground(st);
    bits.push(st.active.length ? U.plural(st.active.length, 'task') + ' running' + (fg ? ' (“' + fg.title + '” in the foreground)' : '') : 'nothing running');
    bits.push(U.plural(st.queue.length, 'queued', 'queued'));
    bits.push(st.done.length + ' done');
    return bits.join(', ');
  }

  /* prefill: optional { text, name } from a file dropped on the window. */
  function importDialog(prefill) {
    var parsed = null;

    function check(root) {
      var text = root.querySelector('#import-text').value;
      var verdict = root.querySelector('#import-verdict');
      var go = root.querySelector('#import-go');
      parsed = null;
      if (!text.trim()) {
        verdict.className = 'import-verdict';
        verdict.innerHTML = 'Choose a file, drop one here, or paste YAML above.';
        go.disabled = true;
        return;
      }
      try {
        var r = QDF.serialize.fromYaml(text, QDF.store.now());
        parsed = r.state;
        verdict.className = 'import-verdict is-ok';
        verdict.innerHTML = '<b>Ready to import:</b> ' + U.esc(summary(parsed)) + '. ' +
          'This replaces everything here now; you can undo it afterwards.' +
          (r.warnings.length ? '<ul class="import-warnings">' + r.warnings.slice(0, 6).map(function (w) {
            return '<li>' + U.esc(w) + '</li>';
          }).join('') + (r.warnings.length > 6 ? '<li>…and ' + (r.warnings.length - 6) + ' more.</li>' : '') + '</ul>' : '');
        go.disabled = false;
      } catch (e) {
        verdict.className = 'import-verdict is-error';
        verdict.innerHTML = '<b>Cannot import this.</b> ' + U.esc(e.message);
        go.disabled = true;
      }
    }

    function load(root, file) {
      U.readFile(file, function (err, text) {
        if (err) { QDF.ui.toast('Could not read ' + file.name + '.', { tone: 'error' }); return; }
        root.querySelector('#import-text').value = text;
        root.querySelector('#import-source').textContent = file.name;
        check(root);
      });
    }

    QDF.ui.dialog({
      title: 'Import state',
      wide: true,
      body:
        '<div class="import-drop" id="import-drop">' +
          '<button type="button" class="btn" id="import-choose">' + QDF.icon('importFile') + '<span>Choose file…</span></button>' +
          '<span class="import-drop-text">or drop a <code>.yaml</code> file here, or paste below</span>' +
          '<span class="import-source" id="import-source"></span>' +
        '</div>' +
        '<textarea class="field field-code" id="import-text" spellcheck="false" autocomplete="off" rows="14" ' +
          'placeholder="format: qdvc-focus/1&#10;current:&#10;  title: …" aria-label="YAML to import"></textarea>' +
        '<div class="import-verdict" id="import-verdict" aria-live="polite"></div>',
      buttons: [
        { label: 'Cancel' },
        { label: 'Import and replace', id: 'import-go', primary: true, disabled: true, onClick: function () {
            if (!parsed) return false;
            QDF.store.replace(parsed, 'Import');
            QDF.ui.toast('Imported: ' + summary(QDF.store.get()) + '.', { undo: true });
            return true;
          } }
      ],
      onOpen: function (root) {
        var input = document.getElementById('file-input');
        var ta = root.querySelector('#import-text');
        var drop = root.querySelector('#import-drop');
        var timer = null;
        ta.addEventListener('input', function () {
          clearTimeout(timer);
          root.querySelector('#import-source').textContent = '';
          timer = setTimeout(function () { check(root); }, 200);
        });
        root.querySelector('#import-choose').addEventListener('click', function () {
          input.value = '';
          input.onchange = function () { if (input.files && input.files[0]) load(root, input.files[0]); };
          input.click();
        });
        drop.addEventListener('dragover', function (e) {
          if (hasFiles(e)) { e.preventDefault(); e.stopPropagation(); drop.classList.add('is-over'); }
        });
        drop.addEventListener('dragleave', function () { drop.classList.remove('is-over'); });
        drop.addEventListener('drop', function (e) {
          if (!hasFiles(e)) return;
          e.preventDefault();
          e.stopPropagation();
          drop.classList.remove('is-over');
          load(root, e.dataTransfer.files[0]);
        });
        if (prefill) {
          ta.value = prefill.text;
          root.querySelector('#import-source').textContent = prefill.name || '';
        }
        check(root);
        if (!prefill) root.querySelector('#import-choose').focus();
      }
    });
  }

  function hasFiles(e) {
    var types = e.dataTransfer && e.dataTransfer.types;
    return !!types && Array.prototype.indexOf.call(types, 'Files') !== -1;
  }

  return {
    showYaml: showYaml, exportYaml: exportYaml, importDialog: importDialog,
    highlight: highlight, hasFiles: hasFiles
  };
})();
/* ---------- src/js/70-settings.js ---------- */
/* ==========================================================================
   70-settings.js — the settings window: a preferences window with three
   panes. Appearance (theme), Data (the YAML view, import, export, clearing
   history, resetting the app) and About (what this is, and the shortcuts).

QDF.settings = (function () {
  var U = QDF.util;

  var KEYS = [
    ['.', 'Jump to now'],
    ['N', 'Add a task to the queue'],
    ['Shift + Enter', 'In the add box: add as up next'],
    ['Ctrl + Enter', 'In the add box: start it now'],
    ['T', 'Show or hide timers'],
    ['[', 'Open or close the overview'],
    [']', 'Open or close the inspector'],
    ['Ctrl + Z', 'Undo the last change (⌘ Z on a Mac)'],
    ['Y', 'Show the current state as YAML'],
    [',', 'Settings'],
    ['?', 'Keyboard shortcuts'],
    ['Esc', 'Close a window, a menu, or the selection']
  ];

  var TABS = [
    ['appearance', 'palette', 'Appearance'],
    ['data', 'database', 'Data'],
    ['about', 'info', 'About']
  ];

  function row(title, sub, button) {
    return '<div class="pref-row"><div class="pref-row-text"><div class="pref-row-title">' + title + '</div>' +
      '<div class="pref-row-sub">' + sub + '</div></div>' + button + '</div>';
  }

  function button(id, icon, label, cls, disabled) {
    return '<button type="button" class="btn' + (cls ? ' ' + cls : '') + '" id="' + id + '"' + (disabled ? ' disabled' : '') + '>' +
      QDF.icon(icon) + '<span>' + label + '</span></button>';
  }

  function storageLine() {
    var info = QDF.store.info(), use = QDF.store.usage();
    if (info.error) return '<span style="color:var(--red)">' + U.esc(info.error) + '</span>';
    if (!use.keys) return 'Nothing is stored in this browser yet; it will be saved with your next change.';
    return 'Kept in this browser: ' + (use.bytes < 1024 ? use.bytes + ' bytes' : (use.bytes / 1024).toFixed(1) + ' KB') +
      (info.savedAt ? ', last saved at ' + U.esc(U.timeOfDay(U.iso(info.savedAt))) : '') + '.';
  }

  function themeNote() {
    return QDF.prefs.get('theme') === 'auto'
      ? 'Auto follows your system setting, which is currently ' + QDF.prefs.effectiveTheme() + '.'
      : 'Auto would follow your system setting.';
  }

  function panes() {
    var theme = QDF.prefs.get('theme');
    var doneCount = QDF.store.get().done.length;
    var choices = [['light', 'Light'], ['dark', 'Dark'], ['auto', 'Auto']].map(function (c) {
      return '<button type="button" class="theme-choice" role="radio" aria-checked="' + (theme === c[0]) + '" data-theme-choice="' + c[0] + '">' +
        '<span class="theme-swatch sw-' + c[0] + '" aria-hidden="true"></span>' + c[1] + '</button>';
    }).join('');

    var appearance =
      '<div class="pref-group"><div class="label">Colour theme</div>' +
        '<div class="theme-picker" role="radiogroup" aria-label="Colour theme">' + choices + '</div>' +
        '<p class="pref-note" id="theme-note">' + themeNote() + '</p>' +
      '</div>';

    var data =
      '<div class="pref-group"><div class="label">Your data</div>' +
        row('Current state as YAML', 'Everything the app is holding, exactly as it would be exported.', button('pref-yaml', 'code', 'View…')) +
        row('Export', 'Download it as a .yaml file, to keep or to carry on in another browser.', button('pref-export', 'exportFile', 'Export…')) +
        row('Import', 'Replace everything here with a .yaml file you exported. You can undo it.', button('pref-import', 'importFile', 'Import…')) +
        '<p class="pref-note" id="pref-storage">' + storageLine() + '</p>' +
      '</div>' +
      '<div class="pref-group"><div class="label">History</div>' +
        row('Clear finished tasks', doneCount
            ? 'Removes ' + U.plural(doneCount, 'finished task') + ' and their history from the timeline. You can undo it.'
            : 'There are no finished tasks to clear.',
          button('pref-clear', 'trash', 'Clear…', '', !doneCount)) +
      '</div>' +
      '<div class="pref-group"><div class="label">Reset</div>' +
        row('Reset app', 'Deletes everything ' + U.esc(QDF.APP.name) + ' keeps in this browser: tasks, history and settings. This cannot be undone.',
          button('pref-reset', 'restore', 'Reset app…', 'btn-danger')) +
      '</div>';

    var about =
      '<div class="about-head"><div class="about-mark" aria-hidden="true">' + QDF.view.brandMark('bm-about') + '</div>' +
        '<div><div class="about-name">' + U.esc(QDF.APP.name) + '</div>' +
        '<div class="dim">Version ' + U.esc(QDF.APP.version) + ' · format ' + U.esc(QDF.APP.format) + '</div></div></div>' +
      '<p>A timeline of your work: what you did, what is running now, and what could come next. ' +
        'Tasks can run in parallel; they branch off side by side and join back up when they end. ' +
        'Pick one to keep in the foreground — the history only records that they ran.</p>' +
      '<p>Everything stays in this browser. Export the YAML to keep a copy, and import it to resume.</p>' +
      '<table class="keys"><tbody>' + KEYS.map(function (k) {
        return '<tr><td>' + k[0].split(' + ').map(function (p) { return '<kbd>' + U.esc(p) + '</kbd>'; }).join(' + ') +
          '</td><td>' + U.esc(k[1]) + '</td></tr>';
      }).join('') + '</tbody></table>';

    return { appearance: appearance, data: data, about: about };
  }

  function show(tab) {
    tab = tab || 'appearance';
    var p = panes();
    var tabs = TABS.map(function (t) {
      return '<button type="button" class="pref-tab" role="tab" id="pref-tab-' + t[0] + '" aria-controls="pref-pane-' + t[0] + '" ' +
        'aria-selected="' + (t[0] === tab) + '" data-pref-tab="' + t[0] + '">' + QDF.icon(t[1]) + '<span>' + t[2] + '</span></button>';
    }).join('');
    var body = '<div class="pref-tabs" role="tablist">' + tabs + '</div>' +
      TABS.map(function (t) {
        return '<div class="pref-pane' + (t[0] === tab ? ' is-shown' : '') + '" role="tabpanel" id="pref-pane-' + t[0] + '" aria-labelledby="pref-tab-' + t[0] + '">' + p[t[0]] + '</div>';
      }).join('');

    QDF.ui.dialog({
      title: 'Settings',
      className: 'dialog-prefs',
      body: body,
      buttons: [{ label: 'Done', primary: true }],
      onOpen: function (root) {
        root.addEventListener('click', function (e) {
          var t = e.target.closest('[data-pref-tab]');
          if (t) {
            var name = t.getAttribute('data-pref-tab');
            Array.prototype.forEach.call(root.querySelectorAll('[data-pref-tab]'), function (b) {
              b.setAttribute('aria-selected', String(b === t));
            });
            Array.prototype.forEach.call(root.querySelectorAll('.pref-pane'), function (pane) {
              pane.classList.toggle('is-shown', pane.id === 'pref-pane-' + name);
            });
            return;
          }
          var choice = e.target.closest('[data-theme-choice]');
          if (choice) {
            QDF.prefs.set('theme', choice.getAttribute('data-theme-choice'));
            Array.prototype.forEach.call(root.querySelectorAll('[data-theme-choice]'), function (b) {
              b.setAttribute('aria-checked', String(b === choice));
            });
            root.querySelector('#theme-note').textContent = themeNote();
            return;
          }
          var btn = e.target.closest('button[id^="pref-"]');
          if (!btn || btn.disabled) return;
          switch (btn.id) {
            case 'pref-yaml': QDF.transfer.showYaml(); break;
            case 'pref-export': QDF.transfer.exportYaml(); root.querySelector('#pref-storage').innerHTML = storageLine(); break;
            case 'pref-import': QDF.transfer.importDialog(); break;
            case 'pref-clear': QDF.ui.closeDialog(); QDF.app.clearDone(); break;
            case 'pref-reset': confirmReset(); break;
          }
        });
        var selected = root.querySelector('.pref-tab[aria-selected="true"]');
        if (selected) selected.focus();
      }
    });
  }

  function confirmReset() {
    var use = QDF.store.usage();
    QDF.ui.dialog({
      title: 'Reset ' + QDF.APP.name + '?',
      body: '<div class="dialog-message"><p>This deletes everything the app keeps in this browser' +
        (use.keys ? ' (' + U.plural(use.keys, 'storage key') + ')' : '') +
        ': every task, the whole history, and your settings. It cannot be undone.</p>' +
        '<p>If you might want any of it back, export a copy first.</p></div>',
      buttons: [
        { label: 'Export a copy first', icon: 'exportFile', align: 'left', onClick: function () { QDF.transfer.exportYaml(); return false; } },
        { label: 'Cancel' },
        { label: 'Reset everything', danger: true, onClick: function () { QDF.app.resetAll(); } }
      ]
    });
  }

  return { show: show };
})();
/* ---------- src/js/80-keys.js ---------- */
/* ==========================================================================
   80-keys.js — keyboard shortcuts. Single-key shortcuts are ignored while
   typing in a field, while a dialog or menu is open, and with modifiers.
   The table in 70-settings.js (About) lists them; keep the two in step.
   ========================================================================== */

QDF.keys = (function () {

  function isTyping(t) {
    return !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  }

  function onKeyDown(e) {
    if (QDF.ui.handleKey(e)) return;
    var t = e.target;
    var typing = isTyping(t);
    var mod = e.ctrlKey || e.metaKey;

    if (e.key === 'Escape' && typing) {
      if (t.id === 'add-input' || t.id === 'quick-start-input') t.value = '';
      t.blur();
      return;
    }
    if (mod && !e.shiftKey && !e.altKey && (e.key === 'z' || e.key === 'Z') && !typing && !QDF.ui.isOpen()) {
      e.preventDefault();
      QDF.app.undo();
      return;
    }
    if (typing || mod || e.altKey || QDF.ui.isOpen()) return;

    var A = QDF.app.actions;
    switch (e.key) {
      case 'n': case 'N': case '/': e.preventDefault(); QDF.app.focusAdd(); break;
      case '.': e.preventDefault(); A['jump-now'](); break;
      case '[': e.preventDefault(); A['toggle-overview'](); break;
      case ']': e.preventDefault(); A['toggle-inspector'](); break;
      case 'y': case 'Y': e.preventDefault(); QDF.transfer.showYaml(); break;
      case 't': case 'T': e.preventDefault(); A['toggle-timers'](); break;
      case ',': e.preventDefault(); QDF.settings.show(); break;
      case '?': e.preventDefault(); QDF.settings.show('about'); break;
      case 'Escape': QDF.app.select(null); break;
    }
  }

  return { onKeyDown: onKeyDown, isTyping: isTyping };
})();
/* ---------- src/js/90-app.js ---------- */
/* ==========================================================================
   90-app.js — the controller: boot, rendering, selection, drawers, actions,
   drag and drop, keeping "now" in view, and the twice-a-second refresh of
   every running clock.

   Buttons declare what they do with data-act (and data-id for the task);
   one delegated click handler looks the name up in ACTIONS. Cards carry
   data-select; clicking one selects it and opens the inspector. Every
   change goes through QDF.store.commit, which re-renders via onChange.
   ========================================================================== */

QDF.app = (function () {
  var U = QDF.util, M = QDF.model, S = QDF.store, V = QDF.view, ui = QDF.ui, P = QDF.prefs;

  var selectedId = null;
  var drag = null;          /* { id, card } while a task is being dragged */
  var activeZone = null;
  var marker = null;
  var renderedDay = '';
  var firstRender = true;
  var jumpPending = false;

  function $(id) {
    return document.getElementById(id);
  }

  function q(title) {
    return '\u201c' + title + '\u201d';
  }

  /* ---------------------------------------------------- keeping "now" */

  function scroller() { return $('timeline-scroll'); }
  function anchor() { return $('tl-now'); }

  /* Where the present sits in the viewport, so a re-render that adds a row
     above it (a task finished, say) can keep it exactly where it was. */
  function anchorPosition() {
    var el = anchor(), sc = scroller();
    if (!el || !sc) return null;
    var top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top;
    return { top: top, visible: top > -el.offsetHeight && top < sc.clientHeight };
  }

  function jumpNow(smooth) {
    var el = anchor(), sc = scroller();
    if (!el || !sc) return;
    var top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top;
    /* The now line sits low in the view: the running cards end just above
       it, and the queue starts just below. */
    var target = sc.scrollTop + top - Math.round(sc.clientHeight * 0.68);
    if (sc.scrollTo) sc.scrollTo({ top: target, behavior: smooth ? 'smooth' : 'auto' });
    else sc.scrollTop = target;
  }

  function jumpDay(key) {
    var el = $('tl-day-' + key), sc = scroller();
    if (!el || !sc) return;
    var top = el.getBoundingClientRect().top - sc.getBoundingClientRect().top;
    sc.scrollTo({ top: sc.scrollTop + top - 8, behavior: 'smooth' });
  }

  var jumpFrame = 0;
  function updateJump() {
    jumpFrame = 0;
    var btn = $('jump-now'), el = anchor(), sc = scroller();
    if (!btn || !el || !sc) return;
    var r = el.getBoundingClientRect(), b = sc.getBoundingClientRect();
    var below = r.top > b.bottom - 40, above = r.bottom < b.top + 40;
    btn.hidden = !(below || above);
    btn.setAttribute('data-dir', below ? 'down' : 'up');
  }

  function scheduleJumpUpdate() {
    if (!jumpFrame) jumpFrame = (window.requestAnimationFrame || setTimeout)(updateJump);
  }

  /* --------------------------------------------------------- render */

  /* Re-rendering replaces markup, so remember what had focus and put it
     back: the same id, or the same action on the same task. A field being
     typed in keeps what was typed. */
  function captureFocus() {
    var el = document.activeElement;
    if (!el || el === document.body) return null;
    return {
      id: el.id || null,
      act: el.getAttribute && el.getAttribute('data-act'),
      dataId: el.getAttribute && el.getAttribute('data-id'),
      value: 'value' in el ? el.value : null,
      start: el.selectionStart, end: el.selectionEnd
    };
  }

  function restoreFocus(f) {
    if (!f || document.activeElement !== document.body) return;
    var el = f.id ? $(f.id) : null;
    if (!el && f.act) {
      el = document.querySelector('[data-act="' + f.act + '"]' + (f.dataId ? '[data-id="' + String(f.dataId).replace(/["\\]/g, '\\$&') + '"]' : ''));
    }
    if (!el) return;
    el.focus({ preventScroll: true });
    if (f.value !== null && 'value' in el && el.value !== f.value) {
      el.value = f.value;
      try { el.setSelectionRange(f.start, f.end); } catch (e) { /* not a text field */ }
    }
  }

  function applyDrawers() {
    var ws = $('workspace');
    var left = !!P.get('overview'), right = !!P.get('inspector');
    ws.classList.toggle('left-open', left);
    ws.classList.toggle('right-open', right);
    $('handle-left').setAttribute('aria-expanded', String(left));
    $('handle-right').setAttribute('aria-expanded', String(right));
    $('drawer-left').setAttribute('aria-hidden', String(!left));
    $('drawer-right').setAttribute('aria-hidden', String(!right));
  }

  function render() {
    var s = S.get(), now = S.now();
    if (selectedId && !M.find(s, selectedId)) selectedId = null;
    var focus = captureFocus();
    var before = firstRender ? null : anchorPosition();

    var tl = QDF.timeline.build(s, now);
    var tlEl = $('timeline');
    tlEl.style.setProperty('--graph-w', V.graphWidth(tl) + 'px');
    tlEl.innerHTML = V.timeline(tl, s, now, { selectedId: selectedId });
    $('overview').innerHTML = V.overview(s, now);
    $('inspector').innerHTML = V.inspector(s, now, selectedId);
    $('idle-slot').innerHTML = V.idle(s, now);

    var label = S.undoLabel(), undoBtn = $('btn-undo');
    undoBtn.disabled = !label;
    undoBtn.title = label ? 'Undo: ' + label + ' (Ctrl+Z)' : 'Nothing to undo';
    undoBtn.setAttribute('aria-label', undoBtn.title);
    renderedDay = U.dayKey(U.iso(now));

    if (firstRender || jumpPending) {
      jumpNow(false);
      firstRender = jumpPending = false;
    } else if (before && before.visible) {
      var after = anchorPosition();
      if (after) scroller().scrollTop += after.top - before.top;
    }
    restoreFocus(focus);
    tick();
    updateJump();
  }

  function tick() {
    var s = S.get(), now = S.now();
    if (!s) return;
    var nodes = document.querySelectorAll('[data-tick]');
    for (var k = 0; k < nodes.length; k++) {
      var el = nodes[k];
      var from = el.getAttribute('data-from');
      var sec = (Number(el.getAttribute('data-base')) || 0) + (from ? U.secondsSince(from, now) : 0);
      var text = V.format(el.getAttribute('data-tick'), sec, now);
      if (el.textContent !== text) el.textContent = text;
    }
    var chip = $('idle-chip');
    if (chip) {
      var level = V.idleLevel(M.idle(s, now));
      if (chip.getAttribute('data-level') !== level) chip.setAttribute('data-level', level);
    }
    var fg = M.foreground(s);
    var title = fg
      ? (P.get('timers') ? U.clock(M.elapsed(fg, now)) + ' \u00b7 ' : '') + fg.title + ' \u2014 ' + QDF.APP.name
      : QDF.APP.name;
    if (document.title !== title) document.title = title;
    /* "Today" and "Yesterday" move at midnight; a new minute moves the
       now line's label and the height hints, but those are cheap to leave
       until the next change. */
    if (!drag && renderedDay && U.dayKey(U.iso(now)) !== renderedDay) render();
  }

  /* -------------------------------------------------------- actions */

  function commit(label, fn) {
    return S.commit(label, fn);
  }

  function undo() {
    var label = S.undo();
    ui.clearToasts();
    ui.toast(label ? 'Undone: ' + label + '.' : 'Nothing to undo.', { timeout: 2500 });
  }

  function select(id) {
    if (id === selectedId && (!id || P.get('inspector'))) return;
    selectedId = id;
    if (id) P.set('inspector', true);
    render();
  }

  function focusAdd() {
    var input = $('add-input');
    if (!input) return;
    input.focus();
    input.select();
  }

  /* How the add box was submitted: 'end', 'next' (Shift) or 'start' (Ctrl). */
  function addFromInput(how) {
    var input = $('add-input');
    var title = input.value;
    if (!title.trim()) { input.focus(); return; }
    input.value = '';
    if (how === 'start') {
      commit('Start task', function (s, now) { return M.addAndStart(s, title, '', now); });
    } else {
      commit(how === 'next' ? 'Add task as up next' : 'Add task', function (s, now) {
        return M.add(s, title, '', { next: how === 'next' }, now);
      });
    }
    focusAdd();
  }

  function quickStart(form) {
    var input = form.querySelector('input[name="title"]');
    var title = input.value;
    if (!title.trim()) { input.focus(); return; }
    input.value = '';
    commit('Start task', function (s, now) { return M.addAndStart(s, title, '', now); });
  }

  function alongside(s, item) {
    var others = s.active.filter(function (x) { return x.id !== item.id; });
    return others.length ? ' alongside ' + (others.length === 1 ? q(others[0].title) : U.plural(others.length, 'other task')) : '';
  }

  function startTask(id) {
    var before = S.get();
    var r = commit('Start task', function (s, now) { return M.start(s, id, now); });
    if (r && before.active.length) ui.toast('Started ' + q(r.title) + alongside(S.get(), r) + '.', { undo: true });
  }

  function startNext() {
    var r = commit('Start up next', function (s, now) { return M.startNext(s, now); });
    if (r) ui.toast('Started ' + q(r.title) + alongside(S.get(), r) + '.', { undo: true });
  }

  function finishTask(id) {
    var r = commit('Finish task', function (s, now) { return M.finish(s, id, now); });
    if (r) ui.toast('Done: ' + q(r.title) + '.', { undo: true });
  }

  function finishAndNext(id) {
    var r = commit('Finish task', function (s, now) { return M.finishAndNext(s, id, now); });
    if (r) ui.toast('Done: ' + q(r.done.title) + (r.next ? '. Started ' + q(r.next.title) + '.' : '.'), { undo: true });
  }

  function removeTask(id) {
    var r = commit('Remove task', function (s) { return M.remove(s, id); });
    if (r) ui.toast('Removed ' + q(r.title) + '.', { undo: true });
  }

  function pauseTask(id, where) {
    var r = commit(where === 'end' ? 'Move to end of queue' : 'Pause task', function (s, now) {
      return M.pause(s, id, now, where);
    });
    if (r) ui.toast(where === 'end'
      ? 'Paused ' + q(r.title) + '; it is back at the end of the queue.'
      : 'Paused ' + q(r.title) + '; it is up next.', { undo: true });
  }

  function swapTask(id) {
    var r = commit('Swap with up next', function (s, now) { return M.swapWithNext(s, id, now); });
    if (r) ui.toast('Paused ' + q(r.paused.title) + ' and started ' + q(r.started.title) + '.', { undo: true });
  }

  /* Which running task is in the foreground is a pointer, not history: it
     is saved, but it is not an undo step and no stretch changes. */
  function bringForward(id) {
    S.quiet(function (s) { return M.setForeground(s, id); });
  }

  function clearDone() {
    var n = commit('Clear finished tasks', function (s) { return M.clearDone(s); });
    if (n) ui.toast('Cleared ' + U.plural(n, 'finished task') + ' from the timeline.', { undo: true });
  }

  function taskMenu(anchorEl, id) {
    var s = S.get(), loc = M.find(s, id), next = M.upNext(s);
    if (!loc || loc.list !== 'active') return;
    var isFg = M.foreground(s) === loc.item;
    var items = [
      { label: 'Show in inspector', icon: 'info', onSelect: function () { select(id); } },
      'separator'
    ];
    if (!isFg) items.push({ label: 'Bring to the foreground', icon: 'target', onSelect: function () { bringForward(id); } });
    items.push(
      { label: 'Done', icon: 'check', onSelect: function () { finishTask(id); } },
      { label: next ? 'Pause it and start up next' : 'Pause it and start up next (queue is empty)', icon: 'swap', disabled: !next,
        onSelect: function () { swapTask(id); } },
      { label: 'Pause, keep it up next', icon: 'pause', onSelect: function () { pauseTask(id, 'front'); } },
      { label: 'Pause, back to the end of the queue', icon: 'queueEnd', onSelect: function () { pauseTask(id, 'end'); } },
      'separator',
      { label: 'Remove task', icon: 'trash', danger: true, onSelect: function () { removeTask(id); } }
    );
    ui.menu(anchorEl, items);
  }

  function applyTimers() {
    var on = !!P.get('timers'), btn = $('btn-timers');
    if (!btn) return;
    /* The button is "Hide timers", pressed in while they are hidden. */
    btn.setAttribute('aria-pressed', String(!on));
    btn.title = on ? 'Hide timers (T)' : 'Show timers (T)';
  }

  function resetAll() {
    ui.closeDialog(true);
    S.resetAll();
    P.reset();
    selectedId = null;
    applyDrawers();
    applyTimers();
    jumpPending = true;
    render();
    ui.toast('Reset. Everything ' + QDF.APP.name + ' kept in this browser has been deleted.', { timeout: 6000 });
  }

  function foregroundId() {
    var fg = M.foreground(S.get());
    return fg ? fg.id : null;
  }

  var ACTIONS = {
    'done-next': function (el, id) { finishAndNext(id || foregroundId()); },
    'start-next': function () { startNext(); },
    'start': function (el, id) { startTask(id); },
    'finish': function (el, id) { finishTask(id); },
    'foreground': function (el, id) { bringForward(id); },
    'remove': function (el, id) { removeTask(id); },
    'make-next': function (el, id) {
      commit('Reorder queue', function (s) { return M.makeNext(s, id); });
    },
    'pause-front': function (el, id) { pauseTask(id, 'front'); },
    'pause-end': function (el, id) { pauseTask(id, 'end'); },
    'restore': function (el, id) {
      var r = commit('Restore task', function (s) { return M.restore(s, id); });
      if (r) ui.toast(q(r.title) + ' is back in the queue.', { undo: true });
    },
    'check-in': function () {
      S.touch();
      var chip = $('idle-chip');
      if (chip) {
        chip.classList.add('is-pulsing');
        setTimeout(function () { var c = $('idle-chip'); if (c) c.classList.remove('is-pulsing'); }, 600);
      }
    },
    'task-menu': function (el, id) { taskMenu(el, id); },
    'undo': function () { undo(); },
    'toggle-timers': function () { P.set('timers', !P.get('timers')); },
    'toggle-overview': function () { P.set('overview', !P.get('overview')); },
    'toggle-inspector': function () { P.set('inspector', !P.get('inspector')); },
    'jump-now': function () { jumpNow(true); },
    'jump-day': function (el) { jumpDay(el.getAttribute('data-day')); },
    'settings': function () { QDF.settings.show(); }
  };

  /* --------------------------------------------------------- events */

  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (el && !el.disabled && !el.closest('#layer')) {
      var fn = ACTIONS[el.getAttribute('data-act')];
      if (fn) {
        e.preventDefault();
        fn(el, el.getAttribute('data-id'), e);
        return;
      }
    }
    if (e.target.closest('input, textarea, button, form, a, #layer')) return;
    var card = e.target.closest('[data-select]');
    if (card) select(card.getAttribute('data-select'));
  }

  function onDblClick(e) {
    if (e.target.closest('button, input, textarea, a')) return;
    var card = e.target.closest('[data-select]');
    if (!card) return;
    if (window.getSelection) window.getSelection().removeAllRanges();
    select(card.getAttribute('data-select'));
    var title = $('ins-title');
    if (title) { title.focus(); title.select(); }
  }

  function onSubmit(e) {
    var form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    var kind = form.getAttribute('data-form');
    if (kind === 'add') addFromInput('end');
    else if (kind === 'quick-start') quickStart(form);
  }

  /* Inspector fields save when they lose focus. */
  function onChange(e) {
    var el = e.target.closest && e.target.closest('[data-edit]');
    if (!el) return;
    var id = el.getAttribute('data-id'), field = el.getAttribute('data-edit');
    var fields = {};
    fields[field] = el.value;
    if (field === 'title' && !el.value.trim()) {
      var loc = M.find(S.get(), id);
      if (loc) el.value = loc.item.title;
      return;
    }
    commit('Edit task', function (s) { return M.edit(s, id, fields); });
  }

  function onKeyDownLocal(e) {
    var t = e.target;
    if (t.id === 'add-input' && e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      addFromInput(e.ctrlKey || e.metaKey ? 'start' : e.shiftKey ? 'next' : 'end');
      return true;
    }
    if (t.getAttribute && t.getAttribute('data-edit')) {
      var field = t.getAttribute('data-edit');
      if (e.key === 'Enter' && (field === 'title' || e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        t.blur();
        return true;
      }
    }
    if (e.key === 'Enter' && t.getAttribute && t.getAttribute('data-select') && !QDF.keys.isTyping(t)) {
      e.preventDefault();
      select(t.getAttribute('data-select'));
      return true;
    }
    return false;
  }

  /* ---------------------------------------------- drag and drop */

  function zoneOf(e) {
    return e.target && e.target.closest ? e.target.closest('[data-drop]') : null;
  }

  function setZone(zone) {
    if (activeZone === zone) return;
    if (activeZone) activeZone.classList.remove('drop-active');
    activeZone = zone;
    if (zone) zone.classList.add('drop-active');
  }

  function getMarker() {
    if (!marker) {
      marker = document.createElement('div');
      marker.className = 'drop-marker';
      marker.setAttribute('aria-hidden', 'true');
    }
    return marker;
  }

  function dropMarker() {
    if (marker && marker.parentNode) marker.parentNode.removeChild(marker);
  }

  /* The marker takes no space, so placing it never moves the rows it is
     measured against. */
  function placeMarker(zone, y) {
    var rows = Array.prototype.filter.call(zone.querySelectorAll('.tl-row.tl-future'), function (row) {
      return !row.contains(drag.card);
    });
    var before = null;
    for (var k = 0; k < rows.length; k++) {
      var r = rows[k].getBoundingClientRect();
      if (y < r.top + r.height / 2) { before = rows[k]; break; }
    }
    var m = getMarker();
    var target = before || zone.querySelector('.tl-row.tl-add');
    if (m.nextSibling !== target || m.parentNode !== zone) zone.insertBefore(m, target);
    m.setAttribute('data-before', before ? before.getAttribute('data-row-id') : '');
  }

  function onDragStart(e) {
    var card = e.target.closest && e.target.closest('[data-drag-id]');
    if (!card) return;
    drag = { id: card.getAttribute('data-drag-id'), card: card };
    ui.closeMenu();
    e.dataTransfer.effectAllowed = 'move';
    try {
      e.dataTransfer.setData('text/plain', card.querySelector('.tl-title').textContent);
    } catch (err) { /* the id is kept here anyway */ }
    setTimeout(function () {
      if (!drag) return;
      card.classList.add('is-dragging');
      document.body.classList.add('dragging-task');
    }, 0);
  }

  function onDragOver(e) {
    if (!drag) {
      if (QDF.transfer.hasFiles(e) && !ui.isDialogOpen()) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        document.body.classList.add('file-over');
      }
      return;
    }
    var zone = zoneOf(e);
    setZone(zone);
    if (!zone) { dropMarker(); return; }
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (zone.getAttribute('data-drop') === 'future') placeMarker(zone, e.clientY);
    else dropMarker();
  }

  function onDragLeave(e) {
    if (!e.relatedTarget) {
      document.body.classList.remove('file-over');
      if (drag) { setZone(null); dropMarker(); }
    }
  }

  function endDrag() {
    if (drag && drag.card) drag.card.classList.remove('is-dragging');
    document.body.classList.remove('dragging-task');
    setZone(null);
    dropMarker();
    drag = null;
  }

  function onDrop(e) {
    if (!drag) {
      document.body.classList.remove('file-over');
      if (!QDF.transfer.hasFiles(e) || ui.isDialogOpen()) return;
      e.preventDefault();
      var file = e.dataTransfer.files[0];
      U.readFile(file, function (err, text) {
        if (err) { ui.toast('Could not read ' + file.name + '.', { tone: 'error' }); return; }
        QDF.transfer.importDialog({ text: text, name: file.name });
      });
      return;
    }
    var zone = zoneOf(e);
    if (!zone) { endDrag(); return; }
    e.preventDefault();
    var id = drag.id;
    var kind = zone.getAttribute('data-drop');
    var before = marker && marker.parentNode ? (marker.getAttribute('data-before') || null) : null;
    endDrag();
    if (kind === 'now') startTask(id);
    else if (kind === 'future') commit('Reorder queue', function (s) { return M.moveBefore(s, id, before); });
  }

  /* ------------------------------------------------------------ boot */

  function bind() {
    document.addEventListener('click', onClick);
    document.addEventListener('dblclick', onDblClick);
    document.addEventListener('submit', onSubmit);
    document.addEventListener('change', onChange);
    document.addEventListener('mousedown', ui.onDocumentPointer, true);
    document.addEventListener('keydown', function (e) {
      if (!onKeyDownLocal(e)) QDF.keys.onKeyDown(e);
    });
    document.addEventListener('dragstart', onDragStart);
    document.addEventListener('dragover', onDragOver);
    document.addEventListener('dragleave', onDragLeave);
    document.addEventListener('drop', onDrop);
    document.addEventListener('dragend', endDrag);
    document.addEventListener('visibilitychange', tick);
    window.addEventListener('resize', function () { ui.closeMenu(); scheduleJumpUpdate(); });
    scroller().addEventListener('scroll', scheduleJumpUpdate, { passive: true });

    window.addEventListener('storage', function (e) {
      if (e.key !== QDF.APP.storageKey || drag) return;
      if (S.reloadFromStorage()) ui.toast('Updated with changes made in another tab.', { timeout: 3000 });
    });

    S.onChange(function (ev) {
      /* Any newer change makes an offered Undo refer to something else. */
      if (ev.type !== 'touch') ui.clearToasts();
      if (ev.type === 'replace' || ev.type === 'external') { selectedId = null; jumpPending = true; }
      render();
    });

    P.onChange(function (key) {
      if (key === 'timers' || key === 'reset') { applyTimers(); tick(); }
      if (key === 'overview' || key === 'inspector' || key === 'reset') {
        applyDrawers();
        /* The timeline column changes width as a drawer slides; check the
           jump button once it has settled. */
        setTimeout(updateJump, 300);
      }
    });
  }

  function boot() {
    S.load();
    $('brand-mark').innerHTML = V.brandMark('bm-bar');
    Array.prototype.forEach.call(document.querySelectorAll('[data-icon]'), function (el) {
      el.outerHTML = QDF.icon(el.getAttribute('data-icon'), el.className);
    });
    applyDrawers();
    applyTimers();
    bind();
    render();
    var notice = S.takeNotice();
    if (notice) ui.toast(notice, { tone: 'error', timeout: 15000 });
    setInterval(tick, 500);
  }

  if (typeof document !== 'undefined' && document.addEventListener) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  }

  return {
    boot: boot, render: render, tick: tick, commit: commit, undo: undo,
    focusAdd: focusAdd, select: select, clearDone: clearDone, resetAll: resetAll,
    jumpNow: jumpNow, actions: ACTIONS
  };
})();
</script>
</body>
</html>
