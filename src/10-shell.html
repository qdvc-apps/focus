</head>
<body>
<div class="app" id="app">

  <header class="toolbar" role="banner">
    <div class="brand">
      <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">QDVC Focus</span>
    </div>
    <div class="toolbar-spacer"></div>
    <div class="idle-slot" id="idle-slot"></div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-tools">
      <button type="button" class="tbtn" id="btn-undo" data-act="undo" disabled title="Nothing to undo"><span data-icon="undo"></span><span>Undo</span></button>
      <div class="segmented" role="group" aria-label="State">
        <button type="button" class="tbtn" data-act="show-yaml" title="Show the current state as YAML (Y)"><span data-icon="code"></span><span>YAML</span></button>
        <button type="button" class="tbtn" data-act="import" title="Import a saved state"><span data-icon="importFile"></span><span>Import</span></button>
        <button type="button" class="tbtn" data-act="export" title="Download the current state as a .yaml file"><span data-icon="exportFile"></span><span>Export</span></button>
      </div>
      <button type="button" class="tbtn tbtn-round" data-act="about" title="About and keyboard shortcuts (?)" aria-label="About and keyboard shortcuts"><span data-icon="info"></span></button>
    </div>
  </header>

  <main class="workspace">
    <div class="col-main">
      <section class="now-slot" id="now" aria-label="Working on now"></section>
      <div id="background"></div>
      <div id="done"></div>
    </div>

    <aside class="col-side panel queue-panel" aria-label="Queue">
      <div class="panel-head">
        <span class="panel-title">Queue</span>
        <span class="count-badge" id="queue-count"></span>
      </div>
      <form class="add-form" data-form="add" autocomplete="off">
        <div class="field-row">
          <input class="field" id="add-input" name="title" maxlength="300" placeholder="Add a task…" aria-label="Add a task to the queue">
          <button type="submit" class="btn"><span data-icon="plus"></span><span>Add</span></button>
        </div>
        <div class="hint"><kbd>Enter</kbd> adds to the end · <kbd>Shift</kbd>+<kbd>Enter</kbd> adds as up next</div>
      </form>
      <div class="queue-body" id="queue-body"></div>
    </aside>
  </main>

  <footer class="statusbar" id="statusbar" role="contentinfo"></footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="layer"></div>
<div class="file-drop-veil" aria-hidden="true"><div class="file-drop-card">Drop the .yaml file to import it</div></div>
<input type="file" id="file-input" accept=".yaml,.yml,.txt,text/yaml,application/yaml,text/plain" hidden>
