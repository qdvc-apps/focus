</head>
<body>
<div class="app" id="app">

  <header class="toolbar" role="banner">
    <div class="brand">
      <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">QDVC Focus</span>
    </div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-centre">
      <div class="idle-slot" id="idle-slot"></div>
      <button type="button" class="tbtn tbtn-toggle" id="btn-timers" data-act="toggle-timers" aria-pressed="false" title="Hide timers (T)" aria-label="Hide timers"><span class="when-on" data-icon="stopwatch"></span><span class="when-off" data-icon="stopwatchOff"></span></button>
    </div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-tools">
      <button type="button" class="tbtn" id="btn-undo" data-act="undo" disabled title="Nothing to undo" aria-label="Nothing to undo"><span data-icon="undo"></span></button>
      <button type="button" class="tbtn" data-act="settings" title="Settings (,)" aria-label="Settings"><span data-icon="gear"></span></button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <aside class="drawer drawer-left" id="drawer-left" aria-label="Overview">
      <div class="drawer-inner" id="overview"></div>
    </aside>

    <main class="stage">
      <div class="timeline-scroll" id="timeline-scroll">
        <div class="timeline" id="timeline" aria-label="Timeline"></div>
      </div>
      <button type="button" class="drawer-handle handle-left" id="handle-left" data-act="toggle-overview" aria-controls="drawer-left" aria-expanded="false" title="Overview ([)">
        <span class="handle-grip" aria-hidden="true"></span><span class="handle-label">Overview</span><span class="handle-chevron" data-icon="chevron"></span>
      </button>
      <button type="button" class="drawer-handle handle-right" id="handle-right" data-act="toggle-inspector" aria-controls="drawer-right" aria-expanded="false" title="Inspector (])">
        <span class="handle-grip" aria-hidden="true"></span><span class="handle-label">Inspector</span><span class="handle-chevron" data-icon="chevron"></span>
      </button>
      <button type="button" class="jump-now" id="jump-now" data-act="jump-now" data-dir="down" hidden title="Jump to now (.)"><span data-icon="down"></span><span>Jump to now</span></button>
    </main>

    <aside class="drawer drawer-right" id="drawer-right" aria-label="Inspector">
      <div class="drawer-inner" id="inspector"></div>
    </aside>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="layer"></div>
<div class="file-drop-veil" aria-hidden="true"><div class="file-drop-card">Drop the .yaml file to import it</div></div>
<input type="file" id="file-input" accept=".yaml,.yml,.txt,text/yaml,application/yaml,text/plain" hidden>
